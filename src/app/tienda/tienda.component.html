<div class="min-h-screen" style="background-color: #938EBA;">
  <!-- Header -->
  <header style="background-color: #73487A;" class="shadow-sm">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-white">Granja Gaia</h1>
      <nav class="flex space-x-6">
        <a href="/events" class="text-white hover:text-gray-200 font-medium">Eventos</a>
        <a href="/contact" class="text-white hover:text-gray-200 font-medium">Contacto</a>
      </nav>
    </div>
  </header>

  <section style="background-color: #B7A3DE;" class="text-white py-1">
    <div class="container mx-auto px-4 text-center">
      <img src="/logo-removebg-preview.png" alt="Logo Granja Gaia" class="mx-auto mb-6 h-24 w-auto">
      <h2 class="text-3xl md:text-4xl font-bold mb-6" style="color: #FFFFFF;">
        🏪🍎Bienvenidos a nuestra Tienda en Granja Gaia 🥕🍋
      </h2>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container mx-auto px-4 py-8">
    <div class="min-h-screen bg-white rounded-lg shadow-md py-8 px-4">
      <h1 class="text-4xl font-bold text-center mb-12 text-purple-900 font-sans transition duration-500 hover:text-indigo-600">
        Productos de nuestra Granja
      </h1>

      <!-- Filtros -->
      <div class="mb-8 p-6 rounded-lg shadow-md bg-indigo-200">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
          <div class="w-full md:w-1/3">
            <label for="categoria" class="block text-sm font-medium text-purple-900">Categoría</label>
            <select id="categoria" [(ngModel)]="filtro.idCategoria" (change)="filtrarProductos()"
                    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600 rounded-md transition duration-300">
              <option value="">Todas las categorías</option>
              <option *ngFor="let cat of categorias" [value]="cat.id">{{cat.nombre}}</option>
            </select>
          </div>

          <div class="w-full md:w-1/3">
            <label class="block text-sm font-medium text-purple-900">Rango de precios</label>
            <div class="flex items-center space-x-4 mt-1">
              <input type="number" [(ngModel)]="filtro.precioMin" placeholder="Mín"
                     class="w-1/2 pl-3 pr-3 py-2 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600 rounded-md transition duration-300">
              <span>-</span>
              <input type="number" [(ngModel)]="filtro.precioMax" placeholder="Máx"
                     class="w-1/2 pl-3 pr-3 py-2 text-base border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600 rounded-md transition duration-300">
            </div>
          </div>

          <div class="flex items-center space-x-4">
            <button (click)="filtrarProductos()"
                    class="px-4 py-2 rounded-md font-medium text-white bg-purple-900 hover:bg-purple-700 transition duration-300 transform hover:scale-105">
              Filtrar
            </button>
            <button (click)="limpiarFiltros()"
                    class="px-4 py-2 rounded-md font-medium text-gray-700 bg-gray-200 hover:bg-gray-300 transition duration-300 border border-gray-300">
              Limpiar
            </button>
          </div>
        </div>

        <div class="mt-4 flex flex-wrap items-center gap-4">
          <label class="inline-flex items-center">
            <input type="checkbox" [(ngModel)]="filtro.soloPopulares" (change)="filtrarProductos()"
                   class="rounded text-purple-600 focus:ring-purple-500 transition duration-300">
            <span class="ml-2 text-sm text-purple-900">Solo productos populares</span>
          </label>

          <div class="ml-auto">
            <label for="orden" class="text-sm mr-2 text-purple-900">Ordenar por:</label>
            <select id="orden" [(ngModel)]="filtro.orden" (change)="filtrarProductos()"
                    class="pl-3 pr-10 py-1 text-sm border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600 rounded-md transition duration-300">
              <option value="novedades">Novedades</option>
              <option value="precio_asc">Precio: menor a mayor</option>
              <option value="precio_desc">Precio: mayor a menor</option>
              <option value="popularidad">Popularidad</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Listado de Productos -->
      <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div *ngFor="let producto of productos" class="border rounded-lg p-4">
          <img [src]="producto.imagenUrl" alt="{{ producto.nombre }}" class="w-full h-48 object-cover mb-4">
          <h3 class="text-lg font-bold">{{ producto.nombre }}</h3>
          <p class="text-sm text-gray-600">{{ producto.descripcion }}</p>
          <p class="font-semibold text-purple-900">{{ producto.precio | currency }}</p>
          <button (click)="verDetalle(producto.id)" class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-md hover:bg-purple-700">
            Ver detalles
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: #73487A;" class="text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <p>© 2023 Granja Escuela Gaia. Todos los derechos reservados.</p>
    </div>
  </footer>
</div>
