<div class="min-h-screen" style="background-color: #938EBA;">
  <!-- Header -->
  <header style="background-color: #73487A;" class="shadow-sm">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-white">Granja Gaia</h1>
      <nav class="flex space-x-6">
        <a href="#" class="text-white hover:text-gray-200 font-medium">Tienda</a>
        <a href="/contact" class="text-white hover:text-gray-200 font-medium">Contacto</a>
      </nav>
    </div>
  </header>

  <section style="background-color: #B7A3DE;" class="text-white py-1">
    <div class="container mx-auto px-4 text-center">
      <img src="/logo-removebg-preview.png" alt="Logo Granja Gaia" class="mx-auto mb-6 h-24 w-auto">
    </div>
  </section>

  <main class="container mx-auto px-4 py-8">
    <div class="min-h-screen" style="background-color: #B1C4DD;">
      <div class="container mx-auto px-4 py-8">
        <!-- Estados de carga y error (igual que antes) -->

        <!-- Detalles del evento -->
        <div *ngIf="!loading && !error && evento" class="bg-white rounded-lg shadow-lg overflow-hidden max-w-4xl mx-auto">
          <div class="p-6">
            <!-- Imagen y detalles del evento (igual que antes) -->

            <!-- Formulario de inscripción simplificado -->
            <div class="mb-8 p-6 bg-gray-50 rounded-lg">
              <h2 class="text-2xl font-bold mb-6 text-center" style="color: #73487A;">
                Formulario de Inscripción
              </h2>

              <div class="grid grid-cols-1 gap-6">
                <!-- Nombre -->
                <div>
                  <label for="nombre" class="block text-gray-700 font-medium mb-2">Nombre completo *</label>
                  <input type="text" id="nombre" [(ngModel)]="formularioInscripcion.nombre"
                         class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Email -->
                <div>
                  <label for="email" class="block text-gray-700 font-medium mb-2">Email *</label>
                  <input type="email" id="email" [(ngModel)]="formularioInscripcion.email"
                         class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>

                <!-- Teléfono -->
                <div>
                  <label for="telefono" class="block text-gray-700 font-medium mb-2">Teléfono</label>
                  <input type="tel" id="telefono" [(ngModel)]="formularioInscripcion.telefono"
                         class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                </div>
              </div>
            </div>

            <!-- Selector de cantidad de personas y botón -->
            <div class="flex flex-col items-center space-y-4 mb-8">
              <div class="flex items-center space-x-4">
                <p class="text-base font-semibold text-gray-800">
                  Cantidad de personas:
                </p>
                <input type="number"
                       [(ngModel)]="formularioInscripcion.cantidadPersonas"
                       min="1"
                       [max]="evento?.capacidad"
                       class="w-20 text-center border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition">
              </div>

              <!-- Botón Inscribirme -->
              <button
                (click)="inscribirme()"
                [disabled]="submitting"
                class="py-3 px-8 rounded-full font-bold text-white transition-all duration-300 shadow-lg hover:shadow-xl"
                style="background-color: #B7A3DE; min-width: 200px;"
                [class.opacity-50]="submitting"
                [class.hover:opacity-90]="!submitting"
                [class.active:scale-95]="!submitting">

                <span *ngIf="!submitting" class="text-lg">Inscribirme</span>
                <span *ngIf="submitting" class="text-lg flex items-center justify-center gap-2">
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Procesando...
              </span>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: #73487A;" class="text-white py-8">
    <div class="container mx-auto px-4 text-center">
      <p>© 2023 Granja Escuela Gaia. Todos los derechos reservados.</p>
    </div>
  </footer>
</div>
