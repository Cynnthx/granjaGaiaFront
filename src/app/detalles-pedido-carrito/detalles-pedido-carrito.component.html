<!-- src/app/detalles-pedido-carrito/detalles-pedido-carrito.component.html -->
<div class="container mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-center mb-8 text-purple-900">🛒 Tu Carrito</h1>
  <div class="bg-white rounded-lg shadow-md p-6">
    <div *ngIf="detallesPedido.length === 0" class="text-center py-4">
      <p class="text-gray-500">Tu carrito está vacío</p>
    </div>
    <div *ngFor="let item of detallesPedido" class="py-4 border-b border-gray-200 last:border-b-0">
      <div class="flex justify-between">
        <div>
          <h4 class="font-medium text-purple-900">{{item.nombreProducto}}</h4>
          <p class="text-sm text-gray-500">{{item.precioUnitario | currency}} x {{item.cantidad}}</p>
        </div>
        <div class="flex items-center">
          <span class="font-bold mr-4">{{item.total | currency}}</span>
          <button (click)="eliminarDetalle(item.id)" class="text-red-500">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div *ngIf="detallesPedido.length > 0" class="mt-6">
      <div class="flex justify-between py-2 border-t border-gray-200">
        <span class="font-semibold">Total:</span>
        <span class="font-bold text-purple-900">{{totalCarrito | currency}}</span>
      </div>
      <button (click)="vaciarCarrito()" class="w-full mt-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
        Vaciar Carrito
      </button>
    </div>
  </div>
</div>
