<div class="min-h-screen flex flex-col" style="background-color: #938EBA;">
  <!-- Header -->
  <header style="background-color: #73487A;" class="shadow-sm">
    <div class="container mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-white">Granja Gaia</h1>
      <nav class="flex space-x-6">
        <a href="/contact" class="text-white hover:text-gray-200 font-medium">Contacto</a>
      </nav>
    </div>
  </header>

  <!-- Contenido del login -->
  <main class="flex-grow flex items-center justify-center py-12">
    <div class="flex w-96 min-h-full flex-col justify-center px-6 py-12 lg:px-8 bg-[#B1C4DD] rounded-2xl items-center shadow-md">
      <div class="sm:mx-auto sm:w-full sm:max-w-sm">
        <h2 class="text-center text-3xl font-extrabold text-[#73487A]">
          Iniciar sesión en GranjaGaia
        </h2>
      </div>

      <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
        <form class="space-y-6" [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div>
            <label for="email" class="block text-sm font-medium text-[#73487A]">Email</label>
            <div class="mt-2">
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
                formControlName="email"
                class="px-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#73487A] sm:text-sm"
                placeholder="tu@email.com"
                style="background-color: #E3F3F9;"
              >
              <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="mt-1 text-sm text-red-600">
                Por favor ingresa un email válido
              </div>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="contrasena" class="block text-sm font-medium text-[#73487A]">Contraseña</label>
            </div>
            <div class="mt-2">
              <input
                id="contrasena"
                name="contrasena"
                type="password"
                autocomplete="current-password"
                required
                formControlName="contrasena"
                class="px-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-[#73487A] sm:text-sm"
                placeholder="Tu contraseña"
                style="background-color: #E3F3F9;"
              >
              <div *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched" class="mt-1 text-sm text-red-600">
                La contraseña debe tener al menos 4 caracteres
              </div>
            </div>
          </div>

          <div *ngIf="errorMessage" class="text-sm text-red-600 text-center">
            {{ errorMessage }}
          </div>

          <div>
            <button
              type="submit"
              [disabled]="!loginForm.valid"
              class="flex w-full justify-center rounded-md bg-[#73487A] px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-[#5a3a60] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#73487A] disabled:bg-gray-400 disabled:cursor-not-allowed"
            >
              Iniciar sesión
            </button>
          </div>
        </form>

        <div class="mt-10 text-center text-sm text-black">
          ¿No tienes cuenta?
          <a href="/register" class="font-semibold text-[#2400C5] hover:text-[#1a0091]">
            Regístrate aquí
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer style="background-color: #73487A;" class="py-8 mt-auto">
    <div class="container mx-auto px-4 text-center text-white">
      <p>© 2023 Granja Escuela Gaia. Todos los derechos reservados.</p>
    </div>
  </footer>
</div>
